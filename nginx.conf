server {
    listen 80;
    server_name localhost;
    root /var/www/html/public; # Laravel's document root

    index index.php index.html;

    # Basic setup for Laravel's clean URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to the PHP-FPM service (named 'php' in docker-compose.yml)
    location ~ \.php$ {
        # This points to the PHP-FPM container service name ('app' in our compose file)
        fastcgi_pass app:9000; 
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }
}