services:
    # 1. PHP-FPM Service (Handles Laravel logic)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-php-fpm
        restart: always
        volumes:
            - .:/var/www/html 
        depends_on:
            - db
        environment:
            # Add the Timezone setting here
            TZ: Asia/Jakarta
            # Laravel Environment Variables
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            
    # 2. Nginx Web Server Service (Handles static files and routes)
    nginx:
        image: nginx:stable-alpine
        container_name: laravel-nginx
        restart: always
        ports:
            - '80:80'       # Expose port 80 to the host
        volumes:
            - .:/var/www/html # Mount project code for Nginx to serve
            - ./nginx.conf:/etc/nginx/conf.d/default.conf # Custom Nginx configuration
        depends_on:
            - app # Ensure PHP-FPM is ready before Nginx starts

    # 3. MariaDB Database Service
    db:
        image: mariadb:10.6.22
        container_name: mariadb-db
        restart: always
        environment:
            # Add the Timezone setting here
            TZ: Asia/Jakarta 
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - '3306:3306' # Expose MariaDB port to the host

    # 4. CLI/Artisan Service (for running composer, artisan commands)
    artisan:
        image: php:8.1-cli-alpine 
        container_name: laravel-artisan-cli
        volumes:
            - .:/var/www/html
        depends_on:
            - db
        working_dir: /var/www/html
        environment:
            # Add the Timezone setting here
            TZ: Asia/Jakarta
        entrypoint: [ 'sh', '-c', 'apk add --no-cache git && composer install --ignore-platform-reqs && php artisan' ]
        # NOTE: This entrypoint is more complex because the base CLI image doesn't have composer/git by default.
        # It's usually easier to run commands explicitly (see below).
    mailpit:
        image: axllent/mailpit:latest
        container_name: mailpit
        restart: always
        ports:
            - "8025:8025" # Mailpit Web UI
            - "1025:1025" # SMTP Port
volumes:
    db_data: